<h2 id="orga80d17d">Man page ASCII output</h2>
<div class="outline-text-2" id="text-orga80d17d">
<p>
Simple way to output man page in ASCII only format (no any special symbols):
</p>

<div class="org-src-container">
<pre class="src src-bash">groff -P<span style="color: #696969;">\-</span>c -mandoc -Tascii file.1|col -bx &gt; file.txt
</pre>
</div>

<p>
<code>file.txt</code> is formatted as you see man output on your screen.
</p>
